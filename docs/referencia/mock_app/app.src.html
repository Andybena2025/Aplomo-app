<title>APLOMO.</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Layout: app de una columna (máx. 1080px) con barra superior fija; login a pantalla completa con la foto de portada. Identidad Obsidian & Ivory, solo modo oscuro por decisión del equipo. */
:root{
  --bg:#0B0B0C; --card:#151517; --card2:#1C1C1F; --line:#2B2B2F; --line2:#3A3A40;
  --ivory:#EDE6D8; --plat:#C9CCD2; --muted:#9E998F; --ink:#0B0B0C;
  --verde:#34C759; --amarillo:#FFCC00; --rojo:#FF453A;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ivory);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(34px,6vw,48px);line-height:1.05}
h2{font-size:30px;line-height:1.1}
h3{font-size:22px;line-height:1.2}
p{margin:0}
a{color:var(--ivory)}
button,input,select,textarea{font:inherit;color:inherit}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (pointer:coarse){input,select,textarea{font-size:16px}} /* iPad/iPhone: evita el zoom automático al tocar un campo */
:focus-visible{outline:2px solid var(--plat);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.card.flat{background:transparent}
.hr{height:1px;background:var(--line);margin:4px 0}
/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--line2);background:transparent;padding:10px 18px;cursor:pointer;font-size:14px;font-weight:500;color:var(--ivory);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--plat)}
.btn.p{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.btn.p:hover{background:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{border-color:#5a2a27;color:#ffb1aa}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--plat);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* formularios */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.input,select.input,textarea.input{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;width:100%}
.input:focus{border-color:var(--plat);outline:none}
textarea.input{min-height:76px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card2)}
.check input{margin-top:3px;accent-color:#EDE6D8}
.check b{font-weight:500}
.err{color:#ffb1aa;font-size:13px}
.ok{color:#a8e6b8;font-size:13px}
.hint{font-size:12px;color:var(--muted)}
/* semáforo */
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:3px 11px 3px 9px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.VERDE{color:var(--verde);border-color:rgba(52,199,89,.35);background:rgba(52,199,89,.08)}
.pill.AMARILLO{color:var(--amarillo);border-color:rgba(255,204,0,.35);background:rgba(255,204,0,.08)}
.pill.ROJO{color:var(--rojo);border-color:rgba(255,69,58,.4);background:rgba(255,69,58,.08)}
.tag{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--plat);white-space:nowrap}
.tag.warn{border-color:#5c4b14;color:#f5d86b}
.tag.good{border-color:#1f4d2b;color:#9fe3b0}
/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.nav button{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--muted);cursor:pointer;font-size:14px;white-space:nowrap}
.nav button.on{color:var(--ivory);background:var(--card2)}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.who .avatar{width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;color:var(--plat)}
@media (max-width:720px){.nav{order:3;flex-basis:100%}.who .meta{display:none}}
main{padding-block:28px 64px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
/* tablas */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--card2)}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);font-size:13px}
.tabs button.on{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.25fr 1fr}
.login .hero{position:relative;background:#000 76% center/cover no-repeat;min-height:280px}
.login .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,11,12,.92) 0%,rgba(11,11,12,.6) 45%,rgba(11,11,12,.1) 100%)}
.login .hero .in{position:absolute;inset:auto 0 0 0;padding:48px max(28px,env(safe-area-inset-left,0px));z-index:1;display:flex;flex-direction:column;gap:14px}
.login .form{display:flex;flex-direction:column;justify-content:center;gap:22px;padding:40px max(28px,env(safe-area-inset-right,0px)) 40px 28px;max-width:500px;width:100%;margin:0 auto}
.tagline{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--plat)}
.demoBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.demoBtns .btn{flex-direction:column;gap:2px;border-radius:12px;padding:10px 6px;white-space:normal;text-align:center}
.demoBtns .btn small{color:var(--muted);font-weight:400;font-size:11px}
@media (max-width:820px){.login{grid-template-columns:1fr}.login .hero{min-height:300px}.login .hero .in{padding:24px 20px}.login .form{padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}}
/* logo */
.lockup{display:inline-flex;align-items:flex-end;font-family:var(--serif);color:var(--ivory);line-height:1;letter-spacing:.07em;white-space:nowrap}
/* kpis */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1}
/* árbol empresa */
.tree{display:flex;flex-direction:column;gap:12px}
.sede{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--card)}
.salon{border-left:1px solid var(--line2);margin:12px 0 0 6px;padding-left:16px}
.puesto{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.puesto:last-child{border-bottom:0}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.inline-form .input{flex:1;min-width:160px}
/* asistente */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:22px}
.steps div{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);min-width:0}
.steps div i{display:block;height:3px;border-radius:2px;background:var(--line2)}
.steps div.on{color:var(--ivory)}.steps div.on i,.steps div.done i{background:var(--ivory)}
.steps span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:620px){.steps span{display:none}}
.wizfoot{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{position:relative;border:1px solid var(--line2);border-radius:10px;overflow:hidden;cursor:pointer;background:#000;aspect-ratio:3/4}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .cap{position:absolute;inset:auto 0 0 0;padding:6px 8px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.thumb.sel{border-color:var(--ivory);box-shadow:0 0 0 2px var(--ivory)}
.hideSm{}@media (max-width:520px){.hideSm{display:none}}
.guia{border:1px solid var(--line2);background:var(--card2);border-radius:14px;padding:12px 14px}
.guia summary{cursor:pointer;font-weight:500;color:var(--ivory)}
.guia .in{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start;margin-top:12px}
.guia canvas{width:100%;height:auto;border-radius:10px;display:block}
.guia ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--plat)}
.guia ol b{color:var(--ivory);font-weight:500}
@media (max-width:620px){.guia .in{grid-template-columns:1fr}.guia canvas{max-width:320px}}
.measure{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.measure{grid-template-columns:1fr}}
.canvasbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:#000;touch-action:none}
.canvasbox canvas{display:block;width:100%;height:auto;cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.seglist{display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
.seg .deg{font-variant-numeric:tabular-nums;font-size:18px;font-family:var(--serif)}
.seg .pts{font-size:12px;color:var(--muted);min-width:64px;text-align:right}
.result{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.score{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;border:2px solid;font-family:var(--serif);font-size:64px;line-height:1}
.score.VERDE{color:var(--verde)}.score.AMARILLO{color:var(--amarillo)}.score.ROJO{color:var(--rojo)}
@media (max-width:560px){.result{grid-template-columns:1fr;justify-items:start}}
.sug{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sug:last-child{border-bottom:0}
.sug::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--plat);margin-top:9px}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ivory);color:var(--ink);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.banner{border:1px solid var(--line2);background:var(--card2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--plat)}
/* hoja imprimible (PDF): papel marfil, tinta negra */
.sheetwrap{overflow-x:auto;background:#1a1a1d;border:1px solid var(--line);border-radius:14px;padding:20px}
.sheet{width:794px;margin:0 auto;background:#FBF8F2;color:#141414;font-family:var(--sans);font-size:12px;line-height:1.5;padding:44px 48px}
.sheet h1,.sheet h2,.sheet h3{color:#141414}
.sheet h1{font-size:34px}.sheet h2{font-size:22px}.sheet h3{font-size:17px}
.sheet .sm{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#6d675c}
.sheet table{font-size:11px}
.sheet th{color:#6d675c;border-bottom:1px solid #d9d2c3;padding:7px 8px;font-size:9px}
.sheet td{border-bottom:1px solid #e6e0d3;padding:7px 8px}
.sheet .box{border:1px solid #d9d2c3;border-radius:8px;padding:12px 14px}
.sheet .pill{background:none}
.sheet .pill.VERDE{color:#1d7a35;border-color:#1d7a35}.sheet .pill.AMARILLO{color:#8a6a00;border-color:#b38900}.sheet .pill.ROJO{color:#b3261e;border-color:#b3261e}
.sheet .sg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sheet .bigscore{font-family:var(--serif);font-size:54px;line-height:1}
.sheet img{max-width:100%;border-radius:6px}
.sheet .foot{margin-top:24px;padding-top:10px;border-top:1px solid #d9d2c3;display:flex;justify-content:space-between;font-size:9px;color:#6d675c}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opt{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;color:var(--plat)}
.opt input{position:absolute;opacity:0;pointer-events:none}.opt.on{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}.opt:focus-within{outline:2px solid var(--plat);outline-offset:2px}
.check.aj.on{border-color:rgba(237,230,216,.5)}details.card>summary{cursor:pointer;list-style:none}details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"+ ";color:var(--muted)}details.card[open]>summary::before{content:"− "}
.opt .pts{font-size:12px;opacity:.65;margin-left:4px}.porque{margin:0;padding:12px 14px;list-style:none;border-left:2px solid var(--line2);display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--plat)}.porque .tag{align-self:flex-start}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.slot{display:flex;flex-direction:column;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px}.slot.lista{border-color:rgba(52,199,89,.55)}
.slotTop{display:flex;justify-content:space-between;align-items:center;gap:8px}.slot.lista .slotTop .tag{color:var(--verde);border-color:rgba(52,199,89,.5)}
.slotImg{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:#000}.slotImg img{width:100%;height:100%;object-fit:cover;display:block}
.slotImg .zoom{width:100%;height:100%;background-size:520% auto;background-position:73% 25%}
.slotLbl{position:absolute;top:8px;left:8px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;background:rgba(11,11,12,.72);padding:3px 8px;border-radius:999px;color:var(--plat)}
.slotDia{position:absolute;right:8px;bottom:8px;width:44%;background:rgba(11,11,12,.82);border:1px solid rgba(237,230,216,.18);border-radius:10px;padding:4px;backdrop-filter:blur(6px)}.slotDia svg{display:block;width:100%}
.slotReglas{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--plat)}
.espejo{transform:scaleX(-1)}.otroLado{text-align:left;background:transparent;border:1px dashed var(--line2);border-radius:14px;padding:14px 16px;color:var(--ivory);cursor:pointer;font:inherit}.otroLado:hover{border-color:var(--plat)}
/* Portada con medición */
.login .hero{overflow:hidden}
.login .hero .pz{position:absolute;z-index:1;pointer-events:none}
.login .hero .in{z-index:2}
.pz-svg{width:100%;height:100%;display:block;overflow:visible}
.pz-svg .sk{stroke:#EDE6D8;stroke-width:2;stroke-linecap:round;opacity:.92;stroke-dasharray:1;stroke-dashoffset:1;animation:pzDraw 1.1s .3s cubic-bezier(.6,0,.2,1) forwards}
.pz-svg .sk2{stroke:#EDE6D8;stroke-width:1.4;stroke-linecap:round;opacity:.45;stroke-dasharray:1;stroke-dashoffset:1;animation:pzDraw 1.1s .3s cubic-bezier(.6,0,.2,1) forwards}
.pz-svg .gd{stroke:#C9CCD2;stroke-width:1;stroke-dasharray:.06 .05;opacity:0;animation:pzFade .6s 1.2s forwards}
.pz-svg .arc{fill:none;stroke:#FFCC00;stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;animation:pzDraw .7s 1.3s ease-out forwards}
.pz-svg .plumb{stroke:#EDE6D8;stroke-width:1;stroke-dasharray:3 6;opacity:0;animation:pzFade 1s .1s forwards}
.pz-svg .bob{fill:#EDE6D8;opacity:0;animation:pzFade 1s .1s forwards}
.pz-svg .jt{fill:#0B0B0C;stroke:#EDE6D8;stroke-width:2;opacity:0;animation:pzFade .4s 1s forwards}
.pz-svg .lb{opacity:0;animation:pzFade .6s 1.6s forwards}
.pz-svg .lt{font:600 10.5px var(--sans,Inter,sans-serif);letter-spacing:.2em;fill:#C9CCD2}
.pz-svg .lv{font:400 21px var(--serif,Georgia,serif);fill:#EDE6D8}
@keyframes pzDraw{to{stroke-dashoffset:0}}@keyframes pzFade{to{opacity:1}}
.pz-card{position:absolute;z-index:2;top:32px;left:32px;background:rgba(11,11,12,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(237,230,216,.18);border-radius:14px;padding:14px 18px;min-width:190px;opacity:0;animation:pzFade .8s 2s forwards}
.pz-card .k{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#9E998F}
.pz-card .n{font-family:var(--serif,Georgia,serif);font-size:40px;line-height:1.1;color:#EDE6D8}
.pz-card .nv{display:flex;align-items:center;gap:8px;font-size:13px;color:#C9CCD2}
.pz-card .nv i{width:9px;height:9px;border-radius:50%;background:#FFCC00;display:inline-block}
@media (max-width:820px){.pz-card{display:none}.pz-svg .lb{display:none}}
</style>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
'use strict';
/* =========================================================================
   APLOMO. · Prototipo funcional del PMV (mock app)
   Proyecto Nuclear · Universidad Alexander von Humboldt · 2026-2
   Requisitos: Notion 5.0 (v5). Cada pantalla indica sus RF en comentarios.
   Datos de demostración en el navegador (localStorage). Sin servidor.
   ========================================================================= */

/* ---------- Fotos de demostración (generadas con IA, sin personas reales) ---------- */
const IMG={
  foto1:'__FOTO1__', foto2:'__FOTO2__', foto3:'__FOTO3__',
  foto4:'__FOTO4__', foto5:'__FOTO5__', portada:'__FOTO6__'
};
const IMG_MUESTRA={perfil:'__MUESTRA_PERFIL__',frente:'__MUESTRA_FRENTE__',detalle:'__MUESTRA_DETALLE__'}; // fotos de muestra por tipo de toma (si no hay, se usan las fotos de ejemplo)
const IMG_INFO={
  foto1:{w:900,h:1204,nombre:'Ensamble · perfil',vista:'Lateral'},
  foto2:{w:900,h:1350,nombre:'Ensamble · frente',vista:'Frontal'},
  foto3:{w:900,h:1350,nombre:'Control de calidad · perfil',vista:'Lateral'},
  foto4:{w:900,h:1204,nombre:'Estación ajustable · perfil',vista:'Lateral'},

const MP_URL='https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/';

async function poseLista(){
  if(MP)return MP;
  let base=null;
  // 1) archivos del modelo publicados junto a la app (misma dirección); 2) CDN público
  for(const b of ['mp/',MP_URL]){try{if(!window.Pose)await conTiempo(cargarScript(b+'pose.js'),15000,'tiempo');base=b;break}catch(e){MP_ERR='no cargó '+b+'pose.js'}}
  if(!base||!window.Pose)throw new Error(MP_ERR||'sin Pose');
  const p=new window.Pose({locateFile:f=>base+f+(base==='mp/'&&/\.(data|tflite|binarypb)$/.test(f)?'.wasm':'')}); // los datos del modelo se publican con extensión servible
  p.setOptions({modelComplexity:1,staticImageMode:true,smoothLandmarks:false,minDetectionConfidence:.5});
  p.onResults(r=>{MP_R=r});
  try{await conTiempo(p.initialize(),45000,'el modelo tardó demasiado')}catch(e){MP_ERR=(e&&e.message||String(e)).slice(0,140);throw e}
  MP=p;return p;
}
async function detectarPuntos(src){
  const p=await poseLista();

  MP_R=null;await p.send({image:im});

  const w=im.width,h=im.height,P=i=>({x:clamp(L[i].x,0,1),y:clamp(L[i].y,0,1)});

}

function medirAngulos(L,w,h,lado){
  if(!L||MARCAS.some(m=>!L[m.k]))return null;
  const P={};for(const m of MARCAS)P[m.k]={x:L[m.k].x*w,y:L[m.k].y*h};
  const dir=lado==='Izquierdo'?-1:1;
  const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y});
  const ang=(u,v)=>{const c=(u.x*v.x+u.y*v.y)/(Math.hypot(u.x,u.y)*Math.hypot(v.x,v.y)||1);return Math.acos(clamp(c,-1,1))*180/Math.PI};

  const r=Math.round;
  const d=sub(P.cadera,P.hombro),a=sub(P.codo,P.hombro);
  const brazo={grados:r(ang(d,a)),sentido:cross(d,a)*dir<0?'Flexión':'Extensión'};
  const ante={grados:r(180-ang(sub(P.hombro,P.codo),sub(P.muneca,P.codo)))};
  const mun={grados:r(180-ang(sub(P.codo,P.muneca),sub(P.nudillos,P.muneca)))};
  const t=sub(P.hombro,P.cadera),hd=sub(P.cabeza,P.hombro);
  const cg=r(ang(t,hd));
  const cuello={grados:cg,sentido:(cross(t,hd)*dir>0||cg<=NEUTRO)?'Flexión':'Extensión'};
  const tg=r(ang(t,{x:0,y:-1}));
  const tronco={grados:tg,sentido:(t.x*dir>=0||tg<=NEUTRO)?'Flexión':'Extensión'};
  return {BRAZO:brazo,ANTEBRAZO:ante,MUNECA:mun,CUELLO:cuello,TRONCO:tronco};
}

function calcularRULA(m,ev){
  const aj=ev.aj||{},act=ev.act||{},carga=ev.carga||{};
  const g=k=>m[k]||{grados:0,sentido:'Flexión'};
  const b=g('BRAZO');
  let brazo=b.sentido==='Extensión'?(b.grados<=20?1:2):(b.grados<=20?1:b.grados<=45?2:b.grados<=90?3:4);
  brazo+=(aj.hombroElevado?1:0)+(aj.brazoAbducido?1:0)-(aj.brazoApoyado?1:0);brazo=clamp(brazo,1,6);
  const an=g('ANTEBRAZO');let ante=(an.grados>=60&&an.grados<=100)?1:2;ante+=aj.antebrazoCruza?1:0;ante=clamp(ante,1,3);
  const w=g('MUNECA');let mun=w.grados<=NEUTRO?1:w.grados<=15?2:3;mun+=aj.munecaDesviada?1:0;mun=clamp(mun,1,4);
  const giro=aj.giroExtremo?2:1;
  const n=g('CUELLO');let cue=n.sentido==='Extensión'?4:n.grados<=10?1:n.grados<=20?2:3;

  const tr=g('TRONCO');let tro=tr.grados<=NEUTRO?1:tr.grados<=20?2:tr.grados<=60?3:4;
  tro+=(aj.troncoGirado?1:0)+(aj.troncoInclinado?1:0);tro=clamp(tro,1,6);

  // Actividad muscular y carga se puntúan por separado para el grupo A (brazos) y el grupo B (cuello, tronco, piernas)
  const igual=ev.bIgual!==false;
  const actB=igual?act:(ev.actB||{}),cargaB=igual?carga:(ev.cargaB||{});
  const muscDe=x=>(x.estatica||x.repetitiva)?1:0;
  const fuerzaDe=c=>{const kg=+c.kg||0;if(c.golpes)return 3;if(kg<2)return 0;if(kg<=10)return c.tipo==='Intermitente'?1:2;return c.tipo==='Intermitente'?2:3};
  const muscA=muscDe(act),muscB=muscDe(actB),fuerzaA=fuerzaDe(carga),fuerzaB=fuerzaDe(cargaB);
  const musc=Math.max(muscA,muscB),fuerza=Math.max(fuerzaA,fuerzaB);
  const A=TABLE_A[(brazo-1)*3+(ante-1)][(mun-1)*2+(giro-1)];
  const B=TABLE_B[cue-1][(tro-1)*2+(pier-1)];
  const C=A+muscA+fuerzaA,D=B+muscB+fuerzaB;
  const final=TABLE_C[clamp(C,1,8)-1][clamp(D,1,7)-1];
  const nivel=final<=2?1:final<=4?2:final<=6?3:4;
  return {seg:{BRAZO:brazo,ANTEBRAZO:ante,MUNECA:mun,GIRO:giro,CUELLO:cue,TRONCO:tro,PIERNAS:pier},musc,fuerza,muscA,muscB,fuerzaA,fuerzaB,A,B,C,D,final,nivel,color:colorDe(final)};
}

function colorDe(p){return p<=2?'VERDE':p<=4?'AMARILLO':'ROJO'}
const COLOR_TXT={VERDE:'Verde',AMARILLO:'Amarillo',ROJO:'Rojo'};
const NIVEL_TXT={1:'Postura aceptable',2:'Pueden requerirse cambios; conviene profundizar el estudio',3:'Se requiere rediseñar la tarea pronto',4:'Se requieren cambios urgentes en la tarea'};

/* Sugerencias automáticas del sistema (RF-023a, solo lectura) */
function sugerencias(res,ev){
  const s=[],g=res.seg;
  const levanta=g.TRONCO>=4&&res.fuerza>=2;
  if(levanta)s.push('Elevar la carga del piso: estibas, mesas elevadoras o estanterías entre la altura de la rodilla y del hombro.');
  if(g.BRAZO>=3&&!levanta)s.push('Bajar la superficie de trabajo o subir la plataforma del operario para que los codos queden a la altura de la mesa.');
  if(g.BRAZO>=3&&!levanta)s.push('Acercar las piezas a la zona de alcance cómodo: a menos de 40 cm del borde de la mesa.');
  if(ev.aj&&ev.aj.hombroElevado)s.push('Evitar trabajar con los hombros elevados: ajustar la altura de la mesa a la altura del codo.');
  if(g.ANTEBRAZO>=2&&!levanta)s.push('Ajustar la altura de trabajo para que el codo quede entre 60° y 100°.');
  if(g.MUNECA>=3)s.push('Usar herramientas y sujeciones que permitan mantener la muñeca recta.');
  if(g.CUELLO===4)s.push('Ubicar la carga y el punto de mirada a la altura de los ojos para no levantar la cabeza.');
  else if(g.CUELLO>=3)s.push('Elevar o inclinar la pieza, o usar una lupa articulada, para no flexionar el cuello más de 20°.');
  if(g.TRONCO>=4&&res.fuerza>=2)s.push('Capacitar en levantamiento seguro (rodillas flexionadas, espalda recta y carga pegada al cuerpo) y usar ayudas mecánicas para cargas de más de 10 kg.');
  else if(g.TRONCO>=3)s.push('Evitar inclinar el tronco: subir la superficie si es baja o acercar el trabajo al cuerpo.');
  if(g.PIERNAS===2)s.push('Instalar tapete antifatiga y permitir apoyo equilibrado en ambos pies.');
  if(res.musc)s.push('Programar pausas activas cada hora y rotación de tareas.');
  if(!s.length)s.push('Mantener las condiciones actuales del puesto y reevaluar en 6 meses.');
  return s;
}

/* Evalúa una evaluación completa: un resultado por foto lateral; el del puesto es el más alto (RF-021) */
function evaluar(ev){
  const porFoto=[];
  if(!ev.sinFotos){
    for(const f of ev.fotos||[]){
      if(f.vista!=='Lateral')continue;
      const m=medirAngulos(f.L,f.w,f.h,miraDe(f,ev));
      if(m)porFoto.push({fotoId:f.id,med:m,res:calcularRULA(m,ev)});
    }
  }else if(ev.manual){
    const m={};for(const s of SEGMENTOS){const v=ev.manual[s.k]||{};m[s.k]={grados:+v.grados||0,sentido:v.sentido||'Flexión'}}
    porFoto.push({fotoId:null,med:m,res:calcularRULA(m,ev)});
  }
  if(!porFoto.length)return {porFoto,res:null,sug:[]};
  const peor=porFoto.reduce((a,b)=>b.res.final>a.res.final?b:a);
  return {porFoto,res:peor.res,med:peor.med,sug:sugerencias(peor.res,ev)};
}

function portadaSVG(mode){
  const P=PORTADA_PTS,up=[0,-1],down=[0,1];
  const tr=pzSub(P.hombro,P.cadera),ua=pzSub(P.codo,P.hombro),fa=pzSub(P.muneca,P.codo),ha=pzSub(P.nudillos,P.muneca),nk=pzSub(P.cabeza,P.hombro);
  const M=portadaRULA().m,A={cuello:M.CUELLO.grados,tronco:M.TRONCO.grados,brazo:M.BRAZO.grados,antebrazo:M.ANTEBRAZO.grados,muneca:M.MUNECA.grados};
  const R=x=>Math.round(x);
  const ln=(a,b,cls)=>`<line class="${cls||'sk'}" pathLength="1" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
  const ext=(o,v,len)=>{const m=Math.hypot(v[0],v[1]);return[o[0]+v[0]/m*len,o[1]+v[1]/m*len]};
  const lab=(x,y,t,v,anchor)=>`<g class="lb" transform="translate(${x},${y})"><text class="lt" text-anchor="${anchor||'start'}">${t}</text><text class="lv" y="17" text-anchor="${anchor||'start'}">${v}°</text></g>`;
  const ar=(c,r,v1,v2)=>`<path class="arc" pathLength="1" d="${pzArco(c,r,pzAng(v1),pzAng(v2))}"/>`;
  let s='';
  // Plomada: línea vertical por la cadera (la marca APLOMO)
  const plX=P.cadera[0];
  s+=`<line class="plumb" x1="${plX}" y1="20" x2="${plX}" y2="800"/><path class="bob" d="M${plX-6},800 L${plX+6},800 L${plX},816 Z"/>`;
  if(mode!=='puntos'){
    s+=ln(P.cadera,P.hombro)+ln(P.hombro,P.cabeza)+ln(P.hombro,P.codo)+ln(P.codo,P.muneca)+ln(P.muneca,P.nudillos)+ln(P.cadera,P.rodilla,'sk2')+ln(P.rodilla,P.tobillo,'sk2');
    s+=ln(P.codo,ext(P.codo,ua,46),'gd')+ln(P.muneca,ext(P.muneca,fa,34),'gd');
    s+=ar(P.hombro,44,tr,nk)+ar(P.hombro,64,[-tr[0],-tr[1]],ua)+ar(P.codo,32,ua,fa)+ar(P.muneca,22,fa,ha);
    s+=lab(P.cabeza[0]-100,P.cabeza[1]+50,'CUELLO',R(A.cuello),'end');
    s+=lab(P.hombro[0]-74,P.hombro[1]+64,'BRAZO',R(A.brazo),'end');
    s+=lab(P.codo[0]-50,P.codo[1]+40,'ANTEBRAZO',R(A.antebrazo),'end');
    s+=lab(P.nudillos[0]+18,P.nudillos[1]+34,'MUÑECA',R(A.muneca));
    s+=lab(plX-24,470,'TRONCO',R(A.tronco),'end');
  }
  const pts=['cabeza','hombro','codo','muneca','nudillos','cadera','rodilla','tobillo'];
  s+=pts.map(k=>`<circle class="jt" cx="${P[k][0]}" cy="${P[k][1]}" r="5"/>`).join('');
  return `<svg class="pz-svg" viewBox="0 0 ${PORTADA_W} ${PORTADA_H}" aria-hidden="true">${s}</svg>`;
}
function montarPortada(mode){
  const h=document.querySelector('.login .hero');if(!h)return;
  h.classList.add('pz-'+mode);
  const box=document.createElement('div');box.className='pz';box.innerHTML=portadaSVG(mode);h.appendChild(box);
  const fit=()=>{const W=h.clientWidth,H=h.clientHeight,k=Math.max(W/PORTADA_W,H/PORTADA_H),iw=PORTADA_W*k,ih=PORTADA_H*k;
    Object.assign(box.style,{width:iw+'px',height:ih+'px',left:((W-iw)*PORTADA_POSX)+'px',top:((H-ih)*.5)+'px'})};
  fit();new ResizeObserver(fit).observe(h);
}
function montarLoginPortada(){
  montarPortada('full');
}

      if(near&&(best<(dedo?44:22)||(!sig&&best<(dedo?90:40)))){LZ.drag=near;try{cv.setPointerCapture(e.pointerId)}catch(_){}redibujar();return}
      if(!sig)return;f.L[sig.k]=p;refrescarMedicion()};
    cv.onpointermove=e=>{if(!LZ.drag)return;e.preventDefault();const p=pos(e);f.L[LZ.drag]={x:clamp(p.x,0,1),y:clamp(p.y,0,1)};refrescarMedicion()};
    cv.onpointerup=cv.onpointercancel=cv.onlostpointercapture=()=>{if(!LZ.drag)return;LZ.drag=null;redibujar()};
    cv.addEventListener('touchmove',e=>{if(LZ&&LZ.drag)e.preventDefault()},{passive:false});
    cv.addEventListener('contextmenu',e=>e.preventDefault());
  };img.src=fotoSrc(f);
}
function redibujar(){if(!LZ)return;dibujar(LZ.ctx,LZ.img,LZ.f.L,LZ.cw,LZ.ch,miraDe(LZ.f),{iw:LZ.f.w,ih:LZ.f.h,activo:LZ.drag})}
function refrescarMedicion(){
  redibujar();const f=LZ.f;const med=medirAngulos(f.L,f.w,f.h,miraDe(f));
  const sl=$('#seglist');if(sl)sl.innerHTML=segListHTML(med);
  const sig=MARCAS.find(m=>!f.L||!f.L[m.k]);const b=$('#sigPunto');if(b)b.innerHTML=sig?`Toca: <b>${sig.t}</b> (${MARCAS.indexOf(sig)+1} de 6)`:'Listo: los 6 puntos están marcados.';
}

function fotoMarcada(f,lado,opts){return new Promise(res=>{const img=new Image();img.onload=()=>{const cw=600,ch=Math.round(600*f.h/f.w);const c=document.createElement('canvas');c.width=cw;c.height=ch;dibujar(c.getContext('2d'),img,f.L,cw,ch,lado,Object.assign({iw:f.w,ih:f.h},opts||{}));res(c.toDataURL('image/jpeg',.86))};img.src=fotoSrc(f)})}

async function descargarPdf(){
  const btn=$('#btnPdf'),msg=$('#pdfMsg');btn.disabled=true;msg.textContent='Generando el PDF…';
  try{
    if(!window.html2canvas||!window.jspdf)throw new Error('lib');
    const el=$('#sheet');
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#FBF8F2',useCORS:true});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    const pxPerPt=canvas.width/pw;const pagePx=Math.floor(ph*pxPerPt);
    if(canvas.height<=pagePx*1.12){const k=Math.min(1,pagePx/canvas.height),w=pw*k;pdf.addImage(canvas.toDataURL('image/jpeg',.9),'JPEG',(pw-w)/2,0,w,canvas.height/pxPerPt*k)}
    else for(let y=0,n=0;y<canvas.height;y+=pagePx,n++){
      const h=Math.min(pagePx,canvas.height-y);const c=document.createElement('canvas');c.width=canvas.width;c.height=pagePx;const x=c.getContext('2d');x.fillStyle='#FBF8F2';x.fillRect(0,0,c.width,c.height);x.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(n)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',0,0,pw,ph);
    }
    const nombre=(R.tipo==='ficha'?'Ficha_RULA_':'Informe_RULA_')+(R.tipo==='ficha'?(puestoInfo((S.evaluaciones.find(x=>x.id===R.id)||W).puestoId).p.nombre):emp(R.id).nombre).replace(/[^\wÁÉÍÓÚáéíóúÑñ]+/g,'_')+'.pdf';
    const blob=pdf.output('blob');
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){try{await dl.save({filename:nombre,data:blob});msg.textContent='PDF listo: '+nombre;toast('PDF descargado')}catch(e){msg.textContent=e&&e.code==='declined'?'Descarga cancelada.':'No se pudo guardar el PDF en esta vista. Abre el archivo .html de la app en tu navegador para descargarlo.'}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();a.remove();msg.textContent='PDF listo: '+nombre;toast('PDF descargado')}
  }catch(e){msg.textContent='No se pudo generar el PDF. Revisa la conexión a internet (la app carga dos librerías para crear el PDF) e inténtalo de nuevo.'}
  btn.disabled=false;
}

    noConsent(){S.noEvaluados=S.noEvaluados||[];S.noEvaluados.push({id:uid('ne'),visitaId:W.visitaId,puestoId:W.puestoId,fecha:hoy(),evaluadorId:S.sesion,motivo:'Sin consentimiento del trabajador'});save();const v=W.visitaId;W=null;go('visita',{id:v});toast('Puesto registrado como No evaluado')},
    wAtras(){W.err='';if(W.paso===1){const v=W.visitaId;W=null;go('visita',{id:v});return}W.paso--;render();window.scrollTo(0,0)},
    wSig(){W.err=validarPaso();if(W.err){render();return}W.paso++;render();window.scrollTo(0,0)},
    wGuardar(){guardarEval()},
    wFicha(){const r=evaluar(W);if(!r.res)return;const tmp=Object.assign({},W,{id:'tmp',porFoto:r.porFoto,res:r.res,sug:r.sug});W.id='tmp';Object.assign(W,tmp);go('pdf',{tipo:'ficha',id:'tmp',back:{v:'wizard'}})},
    addDemo(){const k=t.dataset.k,i=IMG_INFO[k];ponerFoto(i.vista==='Lateral'?'perfil':'frente',{src:k,w:i.w,h:i.h});toast('Foto de ejemplo agregada')},
    slotDemo(){const sl=SLOTS.find(x=>x.k===t.dataset.slot);if(sl.k==='detalle'){IMG.mDetalle=IMG_MUESTRA.detalle;ponerFoto('detalle',{src:'mDetalle',w:900,h:1125});toast('Ejemplo agregado')}else{const i=IMG_INFO[sl.demo];ponerFoto(sl.k,{src:sl.demo,w:i.w,h:i.h});toast('Foto de ejemplo agregada')}},
    p3cara(){W.p3cara=t.dataset.c;render();window.scrollTo(0,0)},
    quitarFoto(){W.fotos=W.fotos.filter(f=>f.id!==id);render()},
    fotoActiva(){W.fotoActiva=id;render()},
    ptsDemo(){const f=W.fotos.find(x=>x.id===W.fotoActiva);f.L=demoPuntos(f.src);render()},
    guiaSeg(){W.guiaSeg=t.dataset.k;render()},
    ptsIA(){const f=W.fotos.find(x=>x.id===W.fotoActiva);autoDetectar(f,true)},
    ptsUndo(){const f=W.fotos.find(x=>x.id===W.fotoActiva);if(!f.L)return;const last=[...MARCAS].reverse().find(m=>f.L[m.k]);if(last)delete f.L[last.k];render()},
    ptsClear(){const f=W.fotos.find(x=>x.id===W.fotoActiva);f.L=null;f.ia='manual';render()}
  };
  if(A[a]){e.preventDefault();await A[a]()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr.click')){e.target.click()}});
function validarPaso(){
  if(W.paso===1&&!W.tarea.trim())return 'Escribe la tarea que se observa.';
  if(W.paso===3){
    if(W.noAcepta)return 'El trabajador no aceptó ser evaluado: toca "Terminar: puesto no evaluado".';
    if(!W.sinFotos&&!W.aceptaFotos)return 'Marca la respuesta del trabajador antes de continuar: sin su consentimiento no se puede seguir.';
    if(!W.sinFotos){const falta=SLOTS.filter(sl=>sl.req&&!fotoSlot(sl.k,'principal')).map(sl=>sl.t);if(falta.length)return 'Faltan fotos obligatorias: '+falta.join(' y ')+'. Tómalas como en la muestra.'}
  }
  if(W.paso===4&&!W.sinFotos){const ok=W.fotos.some(f=>f.vista==='Lateral'&&medirAngulos(f.L,f.w,f.h,miraDe(f)));if(!ok)return 'Marca los 6 puntos en al menos una foto lateral.'}
  return '';
}
function guardarEval(){
  const r=evaluar(W);if(!r.res){W.err='Faltan ángulos para calcular el puntaje.';render();return}
  const ev={id:uid('ev'),visitaId:W.visitaId,empresaId:W.empresaId,sedeId:W.sedeId,salonId:W.salonId,puestoId:W.puestoId,evaluadorId:W.evaluadorId,fecha:W.fecha,
    tarea:W.tarea,postura:W.postura,horas:+W.horas,lado:W.lado,codigo:W.codigo,cond:W.cond,aceptaFotos:W.aceptaFotos,sinFotos:W.sinFotos,
    fotos:W.sinFotos?[]:W.fotos.map(f=>({id:f.id,src:f.src,vista:f.vista,w:f.w,h:f.h,L:f.L})),manual:W.sinFotos?W.manual:null,
    aj:W.aj,act:W.act,carga:W.carga,bIgual:W.bIgual!==false,actB:W.actB,cargaB:W.cargaB,piernas:W.piernas,porFoto:r.porFoto,res:r.res,sug:r.sug};
  S.evaluaciones.push(ev);
  const ok=(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(x){return false}})();
  const v=W.visitaId;W=null;go('visita',{id:v});
  toast(ok?`Evaluación guardada: ${ev.res.final} · ${COLOR_TXT[ev.res.color]}`:'Evaluación guardada en esta sesión (el navegador no tiene espacio para conservarla).');
}

/* formularios y campos */
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='fLogin'){const m=login($('#lgCorreo').value,$('#lgPass').value);if(m)$('#lgErr').textContent=m;return}
  if(f.id==='fReg'){
    const v=k=>$('#'+k).value.trim();
    let m='';
    /* Mock app: nada bloquea; los campos vacíos se llenan con datos demo */
    const n=S.usuarios.length+1;
    if(!v('rgNombre'))$('#rgNombre').value='Evaluador Independiente '+n;
    if(!v('rgCorreo'))$('#rgCorreo').value='independiente'+n+'@demo.co';
    if(!v('rgTarjeta'))$('#rgTarjeta').value='IND-'+(70000+n);
    if(S.usuarios.some(u=>u.correo.toLowerCase()===v('rgCorreo').toLowerCase()))m='Ya existe una cuenta con ese correo.';
    if(m){$('#rgErr').textContent=m;return}
    S.usuarios.push({id:uid('u'),nombre:v('rgNombre'),correo:v('rgCorreo'),rol:'EVALUADOR',vinculacion:'Independiente',estado:'Pendiente',cargo:v('rgProf'),tarjeta:v('rgTarjeta'),pass:$('#rgPass').value});
    save();go('registrado',{nombre:v('rgNombre').split(' ')[0]});return;
  }
  if(f.id==='fUsr'){
    const n=$('#nuNombre').value.trim(),c=$('#nuCorreo').value.trim(),rol=$('#nuRol').value;
    if(!n||!/^\S+@\S+\.\S+$/.test(c)){$('#nuErr').textContent='Escribe el nombre y un correo válido.';return}
    if(S.usuarios.some(u=>u.correo.toLowerCase()===c.toLowerCase())){$('#nuErr').textContent='Ya existe una cuenta con ese correo.';return}
    S.usuarios.push({id:uid('u'),nombre:n,correo:c,rol,estado:'Activo',vinculacion:rol==='EVALUADOR'?'Empleado':undefined,empresaId:rol==='USUARIO'?$('#nuEmp').value:undefined});
    R.nuevo=false;save();render();toast('Cuenta creada');return;
  }
  if(f.id==='fEmp'){
    const v=k=>$('#'+k).value.trim();
    if(!v('neNombre')||!v('neNit')){$('#neErr').textContent='La razón social y el NIT son obligatorios.';return}
    if(S.empresas.some(x=>x.nit.replace(/\D/g,'')===v('neNit').replace(/\D/g,''))){$('#neErr').textContent='Ya existe una empresa con ese NIT (RF-010).';return}
    S.empresas.push({id:uid('e'),nombre:v('neNombre'),nit:v('neNit'),sector:v('neSector')||'—',ciudad:v('neCiudad')||'—',contacto:v('neContacto'),sedes:[]});
    R.nueva=false;save();render();toast('Empresa creada');return;
  }
  if(f.id==='fRes'){
    const fe=$('#nrFecha').value;if(!fe){$('#nrErr').textContent='Elige una fecha.';return}
    const s=$('#nrSede').value;if(!s){$('#nrErr').textContent='La empresa no tiene sedes. Agrega una sede primero.';return}
    S.reservas.push({id:uid('r'),empresaId:$('#nrEmp').value,sedeId:s,fecha:fe,hora:$('#nrHora').value,evaluadorId:S.sesion,estado:'Esperando',notas:$('#nrNotas').value.trim()});
    R.nueva=false;R.tab='Esperando';save();render();toast('Reserva creada: Esperando');return;
  }
  if(f.id==='fCancel'){const r=S.reservas.find(x=>x.id===f.dataset.id);const m=$('#cnMotivo').value.trim();if(!m){$('#cnMotivo').focus();return}r.estado='Cancelada';r.motivo=m;R.cancelando=null;save();render();toast('Reserva cancelada');return}
  const fd=f.dataset.form;if(!fd)return;
  const val=n=>(f.elements[n]&&f.elements[n].value||'').trim();
  const e2=emp(f.dataset.e);
  if(fd==='sede'){if(!val('n'))return;e2.sedes.push({id:uid('s'),nombre:val('n'),direccion:val('d'),salones:[]});toast('Sede agregada')}
  if(fd==='salon'){if(!val('n'))return;sedeDe(e2.id,f.dataset.s).salones.push({id:uid('l'),nombre:val('n'),puestos:[]});toast('Salón agregado')}
  if(fd==='puesto'){if(!val('n'))return;sedeDe(e2.id,f.dataset.s).salones.find(l=>l.id===f.dataset.l).puestos.push({id:uid('p'),nombre:val('n'),tarea:val('t')});toast('Puesto agregado')}
  if(fd==='acceso'){const c=val('c');if(!val('n')||!/^\S+@\S+\.\S+$/.test(c)){toast('Escribe el nombre y un correo válido');return}if(S.usuarios.some(u=>u.correo.toLowerCase()===c.toLowerCase())){toast('Ya existe una cuenta con ese correo');return}S.usuarios.push({id:uid('u'),nombre:val('n'),correo:c,rol:'USUARIO',estado:'Activo',empresaId:e2.id});toast('Acceso creado · contraseña '+PASS)}
  save();render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='bqEmp'){R.q=t.value;const pos=t.selectionStart;render();const n=$('#bqEmp');n.focus();n.setSelectionRange(pos,pos);return}
  if(!W)return;
  if(t.dataset.w){W[t.dataset.w]=t.value;return}
  if(t.dataset.c&&t.type!=='checkbox'){W.cond[t.dataset.c]=t.value;return}
  if(t.dataset.m){W.manual[t.dataset.m][t.dataset.f]=t.type==='number'?+t.value:t.value;return}
  if(t.id==='w_kg'){W.carga.kg=+t.value;updParcial()}
  if(t.id==='w_kgB'){W.cargaB.kg=+t.value;updParcial()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='frEmp'){R.emp=t.value;render();return}
  if(t.id==='frColor'){R.color=t.value;render();return}
  if(t.id==='nrEmp'){const e2=emp(t.value);$('#nrSede').innerHTML=e2.sedes.map(s=>`<option value="${s.id}">${esc(s.nombre)}</option>`).join('');return}
  if(!W)return;
  if(t.dataset.w){W[t.dataset.w]=t.value;return}
  if(t.dataset.c&&t.type==='checkbox'){W.cond[t.dataset.c]=t.checked;t.closest('.opt')&&t.closest('.opt').classList.toggle('on',t.checked);return}
  if(t.dataset.m){W.manual[t.dataset.m][t.dataset.f]=t.value;return}
  if(t.dataset.consent){const v=t.dataset.consent;W.aceptaFotos=v==='fotos';W.sinFotos=v==='sin';W.noAcepta=v==='no';if(v!=='fotos')W.fotos=[];W.err='';render();return}
  if(t.dataset.aj==='piernasMal'){W.piernas=!t.checked;(W.ajTocado=W.ajTocado||{}).piernas=true;render();return}
  if(t.dataset.aj){W.aj[t.dataset.aj]=t.checked;(W.ajTocado=W.ajTocado||{})[t.dataset.aj]=true;render();return}
  if(t.dataset.q==='act'){W.act.estatica=t.value==='estatica';W.act.repetitiva=t.value==='repetitiva';render();return}
  if(t.dataset.q==='tipo'){W.carga.tipo=t.value;render();return}
  if(t.dataset.act2){(t.dataset.g==='B'?W.actB:W.act)[t.dataset.act2]=t.checked;updParcial();return}
  if(t.id==='w_bIgual'){W.bIgual=t.checked;render();return}
  if(t.id==='w_tipoB'){W.cargaB.tipo=t.value;updParcial();return}
  if(t.id==='w_golpesB'){W.cargaB.golpes=t.checked;updParcial();return}
  if(t.id==='w_piernas'){W.piernas=t.checked;(W.ajTocado=W.ajTocado||{}).piernas=true;render();return}
  if(t.id==='w_tipo'){W.carga.tipo=t.value;updParcial();return}
  if(t.id==='w_golpes'){W.carga.golpes=t.checked;render();return}
  if(t.dataset.slot&&t.files&&t.files[0]){leerFoto(t.files[0],t.dataset.slot);t.value=''}
});
document.addEventListener('toggle',e=>{if(e.target.id==='p5mas'&&W)W.p5mas=e.target.open},true);
function updParcial(){const el=$('#parcial');if(!el)return;const r=evaluar(W);if(r.res)el.innerHTML=`Vista previa: Puntuación A ${r.res.A} · B ${r.res.B} · C ${r.res.C} · D ${r.res.D} → ${pill(r.res)}`}
/* Pone una foto en su casilla (perfil, frente o detalle) del lado que se está viendo; reemplaza la anterior */
function ponerFoto(slot,d){const cara=W.p3cara||'principal',sl=SLOTS.find(x=>x.k===slot);
  W.fotos=W.fotos.filter(f=>!(f.slot===slot&&(f.cara||'principal')===cara));
  const f=Object.assign({id:uid('f'),slot,cara,vista:sl.vista,L:null},d);if(cara==='otro'&&sl.vista==='Lateral')f.mira=W.lado==='Derecho'?'Izquierdo':'Derecho';
  W.fotos.push(f);W.err='';render()}
function leerFoto(file,slot){
  const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    ponerFoto(slot||'perfil',{src:c.toDataURL('image/jpeg',.82),w:c.width,h:c.height});toast('Foto agregada')};im.onerror=()=>toast('No se pudo leer la imagen. Prueba con una foto JPG o PNG.');im.src=rd.result};rd.readAsDataURL(file);
}
window.__rzw=window.innerWidth;window.addEventListener('resize',()=>{const ww=window.innerWidth;if(ww===window.__rzw)return;window.__rzw=ww; /* iPad/celular: la barra de Safari cambia el alto al hacer scroll; solo redibujar si cambia el ancho */
  if(R.v==='wizard'&&W&&W.paso===4&&LZ&&!LZ.drag){clearTimeout(window.__rz);window.__rz=setTimeout(montarLienzo,150)}});

/* arranque */
load();
S.sesion=null;save(); // la mock app siempre abre en Iniciar sesión, para elegir el rol
render();
